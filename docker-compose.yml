services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dagong_auth
      POSTGRES_USER: dagong_auth
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagong_auth -d dagong_auth"]
      interval: 5s
      retries: 10
volumes:
  auth_pgdata:
