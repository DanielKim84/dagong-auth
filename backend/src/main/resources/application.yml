server:
  port: ${SERVER_PORT:5840}
spring:
  config:
    # 루트 또는 backend 폴더에서 bootRun을 실행해도 루트의 .env를 찾습니다.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: dagong-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dagong_auth}
    username: ${DB_USERNAME:dagong_auth}
    password: ${DB_PASSWORD}
  flyway:
    # DB 구조와 설명은 버전별 SQL로 관리하고 서버 시작 시 적용합니다.
    enabled: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            # REST API 키와 Client Secret은 루트 .env에만 둡니다.
            client-id: ${KAKAO_CLIENT_ID:unconfigured}
            client-secret: ${KAKAO_CLIENT_SECRET:unconfigured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:4840/login/oauth2/code/kakao}
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-info-authentication-method: header
            user-name-attribute: id
logging:
  level:
    org.springframework.security: INFO
dagong:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:5840}
    # 기본값은 통합 JAR가 제공하는 /login 화면입니다. 개발 PC에서는 .env로 Vite(4840) 화면 주소를 지정하고,
    # 이 서버(5840)는 API와 OAuth 엔드포인트만 처리합니다.
    login-page-url: ${AUTH_LOGIN_PAGE_URL:/login}
    login-success-url: ${AUTH_LOGIN_SUCCESS_URL:/login}
    login-failure-url: ${AUTH_LOGIN_FAILURE_URL:/login?error}
    keystore-path: ${AUTH_KEYSTORE_PATH:${user.home}/.dagong-auth/auth-signing.p12}
    keystore-password: ${AUTH_KEYSTORE_PASSWORD}
    keystore-alias: ${AUTH_KEYSTORE_ALIAS:dagong-auth-signing}
    # 맛다공 access token 수명(ISO-8601). refresh token이 없으므로 기본값은 짧게 둡니다.
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:PT30M}
    # 개발용 맛다공 공개 클라이언트. 서버 시작 시 oauth2_registered_client에 등록·동기화하며,
    # 맛다공 가입 API는 이 client_id가 audience에 있는 토큰만 받습니다.
    matdagong-client-id: matdagong-web-dev
    matdagong-redirect-uri: http://localhost:4845/auth/callback
