server:
  port: ${SERVER_PORT:4840}
spring:
  config:
    # 루트 또는 backend 폴더에서 bootRun을 실행해도 루트의 .env를 찾습니다.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: dagong-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dagong_auth}
    username: ${DB_USERNAME:dagong_auth}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마 변경은 Flyway가 담당하고 Hibernate는 엔티티와 DB 구조만 검증합니다.
      ddl-auto: validate
  flyway:
    # Hibernate가 엔티티 매핑을 검사하기 전에 스키마를 적용합니다.
    enabled: true
logging:
  level:
    org.springframework.security: INFO
dagong:
  auth:
    issuer: ${AUTH_ISSUER:http://localhost:4840}
    keystore-path: ${AUTH_KEYSTORE_PATH:${user.home}/.dagong-auth/auth-signing.p12}
    keystore-password: ${AUTH_KEYSTORE_PASSWORD}
    keystore-alias: ${AUTH_KEYSTORE_ALIAS:dagong-auth-signing}
